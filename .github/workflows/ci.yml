name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # File types and patterns specific to this project. Prints locations only, never the values.
      - run: node scripts/scan-secrets.mjs
      # Whole history. Reports where a finding is, with the value redacted from the log.
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source /repo --redact --verbose --no-banner

  checks:
    name: Lint, types, unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
          API_ORIGIN: http://localhost:4000
          NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      - run: npm run test:unit
      # embedded-postgres refuses to run as root, and GitHub runners do not run as root.
      - run: npm run test:integration
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  web-e2e:
    name: Web end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
          API_ORIGIN: http://localhost:4000
          NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium webkit
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  mobile:
    name: Mobile validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @signaldesk/domain
      - run: npm run typecheck -w @signaldesk/mobile
      - run: npm test -w @signaldesk/mobile
      - name: Project health
        run: npx expo-doctor
        working-directory: apps/mobile
      # Proves the JavaScript for both platforms bundles, and that native configuration is valid for both.
      - name: Bundle for Android and iOS
        run: npx expo export --platform android --platform ios --output-dir dist
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          EXPO_PUBLIC_API_URL: https://api.example.invalid
      - name: Generate native projects for both platforms
        run: npx expo prebuild --no-install --clean
        working-directory: apps/mobile
        env:
          APP_VARIANT: production

  android-apk:
    name: Android build
    needs: mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # A test build. It talks to a server on the same computer through adb reverse. See docs/MOBILE.md.
      APP_VARIANT: development
      EXPO_PUBLIC_API_URL: http://localhost:4200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @signaldesk/domain
      - run: npx expo prebuild --platform android --no-install --clean
        working-directory: apps/mobile
      - name: Compile the APK
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: signaldesk-android-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
