name: Shareable Android build

# A test APK for someone outside this network: pushing to this branch builds it against SHARE_API_URL, a
# repository variable holding an HTTPS address. It is signed with the debug key, so it is for testing only.
# The same run packages the code as an over-the-air update (docs/MOBILE.md, "Updates without a new APK"); it is
# published to the server by hand, and only if its fingerprint matches the APK's.
on:
  push:
    branches: ['share/android']

permissions:
  contents: read

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_API_URL: ${{ vars.SHARE_API_URL }}
      # The Expo project that issues push tokens. Not a secret; empty until the owner creates the project.
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @signaldesk/domain
      # Android notifications need Firebase compiled in. The file is written to a temporary folder outside the
      # checkout and never printed; without it (or without the project ID) the app says alerts are not set up.
      - name: Firebase configuration for notifications
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ -n "$EAS_PROJECT_ID" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
            echo "Notifications: included in this APK."
          else
            echo "::warning::Notifications are not in this APK. Set the EAS_PROJECT_ID variable and the GOOGLE_SERVICES_JSON secret (docs/MOBILE.md)."
          fi
      - run: npx expo prebuild --platform android --no-install --clean
        working-directory: apps/mobile
      - name: Compile the APK
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
      # Same checkout and environment as the APK, so the update's code and fingerprint match it.
      - name: Package the over-the-air update
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: node scripts/export-update.mjs "$RUNNER_TEMP/app-update"
      - name: The update must suit this APK
        run: |
          apk_fingerprint=$(unzip -p apps/mobile/android/app/build/outputs/apk/release/app-release.apk assets/fingerprint)
          update_fingerprint=$(tr -d '\n' < "$RUNNER_TEMP/app-update/runtime-version.txt")
          echo "APK: $apk_fingerprint"
          echo "Update: $update_fingerprint"
          if [ -z "$apk_fingerprint" ] || [ "$apk_fingerprint" != "$update_fingerprint" ]; then
            echo "::error::The update's fingerprint differs from the APK's, so no installed APK would run it."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: signaldesk-app-update
          path: ${{ runner.temp }}/app-update
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: signaldesk-share-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
