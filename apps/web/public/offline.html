<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0b0d10;
        color: #eceef1;
        font:
          16px/1.5 system-ui,
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #a4acb6;
        margin: 0 0 20px;
      }
      a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        background: #eceef1;
        color: #0b0d10;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Signals cannot load without a connection, and none are stored on this device. When you are back online, anything
        you missed will appear.
      </p>
      <a href="/app">Try again</a>
    </main>
  </body>
</html>
